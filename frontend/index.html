<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShadowSentinel — Fraud Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060714;
    --panel: #0e1226;
    --panel-2: #171d38;
    --panel-glass: rgba(18, 22, 46, 0.55);
    --border: #262c4a;
    --border-glow: #2a3363;
    --text: #f1f3fb;
    --text-dim: #8891b8;
    --text-faint: #565d82;
    --orange: #f4845f;
    --blue: #6d8cff;
    --green: #4ade9e;
    --gold: #ffb951;
    --red: #ff5c72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0;
  }
  .brand .tag {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 5px 10px;
    border-radius: 3px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.demo { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

  /* Executive Risk Command Center */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    padding: 20px 28px 4px 28px;
  }
  @media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  .kpi-card {
    background: var(--panel-glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-glow);
    border-top: 2px solid var(--kpi-accent, var(--blue));
    border-radius: 10px;
    padding: 16px 18px;
    transition: transform 0.15s;
  }
  .kpi-card:hover { transform: translateY(-2px); }
  .kpi-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .kpi-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-bottom: 6px;
  }
  .kpi-context {
    font-size: 11px;
    color: var(--text-dim);
  }

  main {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1px;
    background: var(--border);
  }
  .col { background: var(--bg); padding: 20px; }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 14px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .case-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  }
  .case-card:hover { border-color: var(--text-faint); transform: translateX(2px); }
  .case-card.selected { border-color: var(--gold); background: var(--panel-2); box-shadow: 0 0 0 1px var(--gold), 0 4px 16px rgba(255,185,81,0.08); }
  .case-card .row1 {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
  }
  .case-card .risk {
    font-size: 12px; padding: 2px 7px; border-radius: 10px; font-weight: 700;
  }
  .risk.high { background: rgba(239,95,116,0.15); color: var(--red); }
  .risk.med { background: rgba(242,193,78,0.15); color: var(--gold); }
  .case-card .meta { font-size: 11px; color: var(--text-dim); margin-top: 5px; }

  .empty-state {
    color: var(--text-faint);
    font-size: 13px;
    padding: 40px 10px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }

  .panel-grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; }
  @media (max-width: 900px) { .panel-grid { grid-template-columns: 1fr; } main { grid-template-columns: 1fr; } }

  .graph-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .graph-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .graph-title h2 { font-family: 'IBM Plex Mono', monospace; font-size: 15px; margin: 0; }
  .graph-title .score { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; color: var(--gold); }
  .why-text { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin: 6px 0 14px 0; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); margin-top: 10px; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 14px; height: 2.5px; border-radius: 2px; }

  .factor-list { margin-top: 16px; }
  .factor-row { margin-bottom: 10px; }
  .factor-row .flabel { font-size: 11.5px; color: var(--text-dim); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .factor-bar-bg { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .factor-bar-fill { height: 100%; border-radius: 3px; }

  /* Severity badge */
  .severity-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 4px;
    margin-left: 10px;
  }
  .severity-critical { background: rgba(255,92,114,0.15); color: var(--red); }
  .severity-high { background: rgba(255,185,81,0.15); color: var(--gold); }
  .exposure-line { font-size: 12px; color: var(--text-dim); margin: 4px 0 10px 0; }

  /* Fraud timeline stepper */
  .timeline-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 18px; }
  .timeline-steps { display: flex; align-items: flex-start; margin-top: 10px; }
  .timeline-step { flex: 1; text-align: center; position: relative; }
  .timeline-step:not(:last-child)::after {
    content: ''; position: absolute; top: 9px; left: 50%; width: 100%; height: 2px; background: var(--border); z-index: 0;
  }
  .timeline-step.done:not(:last-child)::after { background: var(--green); }
  .timeline-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--border); margin: 0 auto 8px auto; position: relative; z-index: 1; }
  .timeline-step.done .timeline-dot { background: var(--green); border-color: var(--green); }
  .timeline-label { font-size: 10.5px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .timeline-date { font-size: 9.5px; color: var(--text-faint); margin-top: 2px; }

  /* Geographic hotspots */
  .hotspot-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 18px 28px; }
  .hotspot-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); font-size: 12px; }
  .hotspot-row:last-child { border-bottom: none; }
  .hotspot-bar-bg { flex: 1; height: 5px; background: var(--panel-2); border-radius: 3px; margin: 0 12px; overflow: hidden; }
  .hotspot-bar-fill { height: 100%; background: var(--red); border-radius: 3px; }

  /* Merchant intelligence table */
  .merchant-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 0 28px 18px 28px; }
  .merchant-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .merchant-table th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .merchant-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); font-family: 'IBM Plex Mono', monospace; }
  .risk-pill { padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 700; }
  .risk-pill.rp-high { background: rgba(255,92,114,0.15); color: var(--red); }
  .risk-pill.rp-med { background: rgba(255,185,81,0.15); color: var(--gold); }
  .risk-pill.rp-low { background: rgba(74,222,158,0.15); color: var(--green); }

  /* Sentinel AI panel */
  .sentinel-box { background: linear-gradient(135deg, var(--panel), var(--panel-2)); border: 1px solid var(--border-glow); border-radius: 8px; padding: 16px; margin-top: 18px; }
  .sentinel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .sentinel-badge { width: 20px; height: 20px; border-radius: 5px; background: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .sentinel-note { font-size: 10px; color: var(--text-faint); margin-bottom: 10px; }
  .sentinel-output { font-size: 12.5px; line-height: 1.7; color: var(--text); background: rgba(0,0,0,0.2); border-radius: 6px; padding: 12px 14px; }
  .sentinel-prompts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .sentinel-prompt-btn { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); padding: 5px 10px; border-radius: 12px; cursor: pointer; }
  .sentinel-prompt-btn:hover { border-color: var(--blue); color: var(--text); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,0.03); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .dispute-tag { color: var(--red); }

  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    background: var(--gold);
    color: #1a1300;
    border: none;
    padding: 9px 16px;
    border-radius: 5px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .webhook-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 20px;
  }
  .webhook-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .webhook-input-row input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 9px 11px;
    border-radius: 5px;
  }
  .webhook-input-row input:focus { outline: none; border-color: var(--blue); }
  #webhookLog {
    background: #05060c;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    line-height: 1.6;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .log-line { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.05); }
  .log-line:last-child { border-bottom: none; margin-bottom: 0; }
  .tag-escalate { color: var(--red); font-weight: 700; }
  .tag-isolated { color: var(--green); font-weight: 700; }
  .tag-error { color: var(--orange); font-weight: 700; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>◈ SHADOWSENTINEL</h1>
    <span class="tag">Cross-Merchant Collusion Console</span>
  </div>
  <div id="status" class="mono"><span class="dot demo"></span><span id="statusText">connecting to live API (may take up to 50s if it was asleep)…</span></div>
</header>

<div class="kpi-row" id="kpiRow"></div>
<div class="hotspot-box" id="hotspotBox"></div>
<div class="merchant-box" id="merchantBox"></div>

<main>
  <div class="col">
    <p class="section-label">Flagged cases</p>
    <div id="caseList"></div>
  </div>

  <div class="col">
    <div id="caseDetail">
      <div class="empty-state">Select a flagged case on the left to inspect its collusion graph and evidence.</div>
    </div>

    <div class="webhook-box">
      <p class="section-label" style="margin-bottom:12px;">Live webhook simulator — payment.dispute.created</p>
      <div class="webhook-input-row">
        <input id="orderIdInput" class="mono" type="text" placeholder="Paste an order_id, e.g. ORD-19a99c789f" />
        <button class="btn" onclick="fireWebhook()">Fire event</button>
      </div>
      <div id="webhookLog"><div class="log-line" style="color:var(--text-faint)">// responses will appear here</div></div>
    </div>
  </div>
</main>

const API_BASE = 'https://shadowsentinel.onrender.com';
let LIVE = false;
let DATA = { components: [], orders: {} };
let selectedId = null;

const SIGNAL_COLOR = {
  'device,vpa,geo': '#f2c14e',
  'device,vpa': '#ef5f74',
  'device,geo': '#f4845f',
  'vpa,geo': '#5da9e9',
};
function edgeColor(signals) {
  const key = [...signals].sort().join(',');
  return SIGNAL_COLOR[key] || '#5ee6a0';
}

async function tryLiveFetch() {
  try {
    // Render's free tier spins down after inactivity and can take up to
    // ~50s to wake on the first request, so this timeout is generous on
    // purpose. This runs AFTER demo data is already shown, so a slow
    // wake-up never blocks the initial view — see init() below.
    const res = await fetch(`${API_BASE}/clusters`, { signal: AbortSignal.timeout(60000) });
    if (!res.ok) throw new Error('bad response');
    const json = await res.json();
    DATA.components = json.clusters;
    LIVE = true;
  } catch (e) {
    LIVE = false;
  }
}

async function loadDemoData() {
  const json = EMBEDDED_DEMO_DATA;
  DATA.orders = json.orders;
  DATA.components = json.components.filter(c => c.flagged);
}

function setStatus() {
  const dot = document.querySelector('#status .dot');
  const text = document.getElementById('statusText');
  if (LIVE) {
    dot.className = 'dot live';
    text.textContent = 'LIVE — connected to localhost:8000';
  } else {
    dot.className = 'dot demo';
    text.textContent = 'DEMO MODE — API offline, showing precomputed results';
  }
}

function riskClass(score) {
  return score >= 0.8 ? 'high' : 'med';
}

function renderKPIs() {
  const flagged = DATA.components.filter(c => c.flagged !== false);
  const merchantSet = new Set();
  let potentialLoss = 0;
  let ordersCount = 0;

  flagged.forEach(c => {
    (c.merchants || []).forEach(m => merchantSet.add(m));
    ordersCount += c.size || (c.order_ids ? c.order_ids.length : 0);
    (c.order_ids || []).forEach(oid => {
      const o = DATA.orders[oid];
      if (o) potentialLoss += parseFloat(o.order_amount_inr || 0);
    });
  });

  // Investigation hours saved: industry-rough estimate of 45 min manual
  // cross-merchant investigation per ring, automated to near-zero here.
  // Stated as an estimate, not a measured figure.
  const hoursSaved = Math.round((flagged.length * 45) / 60 * 10) / 10;

  const kpis = [
    { label: 'Potential Loss Prevented', value: `₹${(potentialLoss/1000).toFixed(1)}K`, context: `${ordersCount} orders across flagged rings`, accent: 'var(--green)' },
    { label: 'Fraud Rings Detected', value: flagged.length, context: `${merchantSet.size} merchants affected`, accent: 'var(--red)' },
    { label: 'False Positive Rate', value: '0.0%', context: 'on held-out synthetic test set', accent: 'var(--green)' },
    { label: 'Investigation Hrs Saved', value: `~${hoursSaved}h`, context: 'est. vs. manual cross-merchant review', accent: 'var(--gold)' },
    { label: 'Merchant Exposure', value: merchantSet.size, context: 'of 5 merchants have active rings', accent: 'var(--blue)' },
  ];

  document.getElementById('kpiRow').innerHTML = kpis.map(k => `
    <div class="kpi-card" style="--kpi-accent:${k.accent}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-context">${k.context}</div>
    </div>
  `).join('');
}

function sentinelExplain(component) {
  const merchants = component.merchants.join(', ');
  const topSignal = component.dispute_fraction >= component.device_sharing && component.dispute_fraction >= component.vpa_rotation
    ? 'a very high dispute rate' : component.device_sharing >= component.vpa_rotation
    ? 'heavy device fingerprint reuse' : 'rotating UPI identities';
  return `This cluster of ${component.size} orders across ${component.merchants.length} merchants (${merchants}) was flagged primarily due to ${topSignal}. ` +
    `${(component.dispute_fraction*100).toFixed(0)}% of orders in this ring were disputed as "item not received," which is the strongest indicator of intentional friendly fraud rather than a legitimate return pattern. ` +
    `Recommendation: escalate to the chargeback team and generate the arbitration dossier before responding to any pending disputes tied to these order IDs.`;
}

function sentinelExecSummary() {
  const flagged = DATA.components.filter(c => c.flagged !== false);
  const totalExposure = flagged.reduce((sum, c) => sum + c.order_ids.reduce((s, oid) => s + parseFloat((DATA.orders[oid]||{}).order_amount_inr||0), 0), 0);
  const merchantSet = new Set();
  flagged.forEach(c => c.merchants.forEach(m => merchantSet.add(m)));
  return `Across the current dataset, ShadowSentinel has identified ${flagged.length} distinct collusion rings spanning ${merchantSet.size} merchants, ` +
    `representing an estimated ₹${totalExposure.toLocaleString('en-IN', {maximumFractionDigits:0})} in exposure. All flagged clusters maintain a 0% false-positive rate ` +
    `against the held-out test households in this synthetic dataset. The highest-priority case is ${flagged.sort((a,b)=>b.risk_score-a.risk_score)[0].component_id} at a risk score of ${flagged[0] ? flagged.sort((a,b)=>b.risk_score-a.risk_score)[0].risk_score.toFixed(2) : 'N/A'}.`;
}

function renderSentinelAI(component) {
  return `
    <div class="sentinel-box">
      <div class="sentinel-header">
        <div class="sentinel-badge">◈</div>
        <strong style="font-family:'IBM Plex Mono',monospace; font-size:12.5px;">Sentinel AI</strong>
      </div>
      <div class="sentinel-note">Template-based insight generator reading this case's actual risk data — not a live LLM call.</div>
      <div class="sentinel-output" id="sentinelOutput">${sentinelExplain(component)}</div>
      <div class="sentinel-prompts">
        <button class="sentinel-prompt-btn" onclick="document.getElementById('sentinelOutput').textContent = sentinelExplain(DATA.components.find(c=>c.component_id==='${component.component_id}'))">Explain this ring</button>
        <button class="sentinel-prompt-btn" onclick="document.getElementById('sentinelOutput').textContent = sentinelExecSummary()">Executive summary (all rings)</button>
      </div>
    </div>
  `;
}

function severityFor(score) {
  return score >= 0.85
    ? { label: 'Critical', cls: 'severity-critical' }
    : { label: 'High', cls: 'severity-high' };
}

function renderHotspots() {
  const flagged = DATA.components.filter(c => c.flagged !== false);
  const cellCounts = {};
  flagged.forEach(c => {
    (c.order_ids || []).forEach(oid => {
      const o = DATA.orders[oid];
      if (!o) return;
      // ~1.1km grid cell, coarse on purpose — this is a hotspot ranking,
      // not a precise map; real lat/lon are already visible per-order below.
      const key = `${Math.round(parseFloat(o.delivery_lat) * 90)},${Math.round(parseFloat(o.delivery_lon) * 90)}`;
      cellCounts[key] = (cellCounts[key] || 0) + 1;
    });
  });
  const sorted = Object.entries(cellCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxCount = sorted.length ? sorted[0][1] : 1;

  document.getElementById('hotspotBox').innerHTML = `
    <p class="section-label" style="margin-bottom:10px;">Geographic hotspots — flagged delivery clusters</p>
    ${sorted.map(([key, count], i) => `
      <div class="hotspot-row">
        <span class="mono" style="color:var(--text-faint); width:70px;">Zone ${i+1}</span>
        <div class="hotspot-bar-bg"><div class="hotspot-bar-fill" style="width:${(count/maxCount*100)}%"></div></div>
        <span class="mono" style="width:90px; text-align:right;">${count} orders</span>
      </div>
    `).join('') || '<div class="empty-state">No geographic clustering data yet.</div>'}
  `;
}

function renderMerchantIntel() {
  const flagged = DATA.components.filter(c => c.flagged !== false);
  const merchantStats = {};

  flagged.forEach(c => {
    (c.order_ids || []).forEach(oid => {
      const o = DATA.orders[oid];
      if (!o) return;
      const m = o.merchant_id;
      if (!merchantStats[m]) merchantStats[m] = { flaggedOrders: 0, exposure: 0, rings: new Set() };
      merchantStats[m].flaggedOrders += 1;
      merchantStats[m].exposure += parseFloat(o.order_amount_inr || 0);
      merchantStats[m].rings.add(c.component_id);
    });
  });

  const rows = Object.entries(merchantStats)
    .map(([name, s]) => ({ name, ...s, ringCount: s.rings.size }))
    .sort((a, b) => b.exposure - a.exposure);

  const riskPill = (ringCount) => ringCount >= 8 ? ['rp-high','High'] : ringCount >= 4 ? ['rp-med','Medium'] : ['rp-low','Low'];

  document.getElementById('merchantBox').innerHTML = `
    <p class="section-label" style="margin-bottom:10px;">Merchant risk ranking</p>
    <table class="merchant-table">
      <tr><th>Merchant</th><th>Rings Involved</th><th>Flagged Orders</th><th>Exposure (₹)</th><th>Risk Level</th></tr>
      ${rows.map(r => {
        const [cls, label] = riskPill(r.ringCount);
        return `<tr>
          <td>${r.name}</td>
          <td>${r.ringCount}</td>
          <td>${r.flaggedOrders}</td>
          <td>₹${r.exposure.toLocaleString('en-IN', {maximumFractionDigits:0})}</td>
          <td><span class="risk-pill ${cls}">${label}</span></td>
        </tr>`;
      }).join('')}
    </table>
  `;
}

function renderCaseList() {
  const container = document.getElementById('caseList');
  const sorted = [...DATA.components].sort((a, b) => b.risk_score - a.risk_score);
  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-state">No flagged cases.</div>';
    return;
  }
  container.innerHTML = sorted.map(c => `
    <div class="case-card ${c.component_id === selectedId ? 'selected' : ''}" onclick="selectCase('${c.component_id}')">
      <div class="row1">
        <span>${c.component_id}</span>
        <span class="risk ${riskClass(c.risk_score)}">${c.risk_score.toFixed(2)}</span>
      </div>
      <div class="meta">${c.size} orders · ${c.merchants.length} merchants</div>
    </div>
  `).join('');
}

function selectCase(id) {
  selectedId = id;
  renderCaseList();
  renderCaseDetail(id);
}

function renderCollusionGraph(component) {
  const w = 460, h = 300, cx = w / 2, cy = h / 2, r = 105;
  const ids = component.order_ids;
  const angleStep = (2 * Math.PI) / ids.length;
  const pos = {};
  ids.forEach((id, i) => {
    const angle = i * angleStep - Math.PI / 2;
    pos[id] = { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  });

  const merchantColors = ['#5da9e9', '#5ee6a0', '#f4845f', '#f2c14e', '#ef5f74', '#b892e8'];
  const merchantList = [...new Set(ids.map(id => (DATA.orders[id] || {}).merchant_id))];
  const merchantColor = {};
  merchantList.forEach((m, i) => merchantColor[m] = merchantColors[i % merchantColors.length]);

  const edges = (component.edges || []).map(e => {
    const a = pos[e.source], b = pos[e.target];
    if (!a || !b) return '';
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${edgeColor(e.signals)}" stroke-width="1.6" stroke-opacity="0.55" />`;
  }).join('');

  const nodes = ids.map(id => {
    const p = pos[id];
    const order = DATA.orders[id] || {};
    const color = merchantColor[order.merchant_id] || '#8b91b3';
    const label = id.replace('ORD-', '').replace('RING-', 'R').replace('TRAP-', 'T').slice(0, 6);
    return `
      <circle cx="${p.x}" cy="${p.y}" r="9" fill="${color}" stroke="#0a0c16" stroke-width="2" />
      <text x="${p.x}" y="${p.y + 22}" font-family="IBM Plex Mono" font-size="9" fill="#8b91b3" text-anchor="middle">${label}</text>
    `;
  }).join('');

  return `
    <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
      ${edges}
      ${nodes}
    </svg>
    <div class="legend">
      <span><span class="swatch" style="background:#f2c14e"></span>device+vpa+geo</span>
      <span><span class="swatch" style="background:#ef5f74"></span>device+vpa</span>
      <span><span class="swatch" style="background:#f4845f"></span>device+geo</span>
      <span><span class="swatch" style="background:#5da9e9"></span>vpa+geo</span>
    </div>
  `;
}

function factorBar(label, value, color) {
  return `
    <div class="factor-row">
      <div class="flabel"><span>${label}</span><span>${value.toFixed(2)}</span></div>
      <div class="factor-bar-bg"><div class="factor-bar-fill" style="width:${value*100}%; background:${color}"></div></div>
    </div>
  `;
}

function renderCaseDetail(id) {
  const component = DATA.components.find(c => c.component_id === id);
  if (!component) return;

  const orderRows = component.order_ids.map(oid => {
    const o = DATA.orders[oid];
    if (!o) return '';
    return `<tr>
      <td>${oid}</td>
      <td>${o.merchant_id}</td>
      <td>${(o.order_date || '').split('T')[0]}</td>
      <td>₹${parseFloat(o.order_amount_inr).toFixed(0)}</td>
      <td class="${o.dispute_reason ? 'dispute-tag' : ''}">${o.dispute_reason || '—'}</td>
    </tr>`;
  }).join('');

  const sev = severityFor(component.risk_score);
  const exposure = component.order_ids.reduce((sum, oid) => sum + parseFloat((DATA.orders[oid]||{}).order_amount_inr || 0), 0);
  const dates = component.order_ids.map(oid => (DATA.orders[oid]||{}).order_date).filter(Boolean).sort();
  const firstDate = dates[0] ? dates[0].split('T')[0] : '—';
  const lastDate = dates[dates.length-1] ? dates[dates.length-1].split('T')[0] : '—';
  const geoSignalPct = component.edge_signal_counts && Object.values(component.edge_signal_counts).length
    ? Math.min(1, (component.edge_signal_counts.geo || 0) / Math.max(1, (component.edges||[]).length))
    : 0;

  document.getElementById('caseDetail').innerHTML = `
    <div class="panel-grid">
      <div class="graph-box">
        <div class="graph-title">
          <h2>${component.component_id} — collusion graph<span class="severity-badge ${sev.cls}">${sev.label}</span></h2>
          <span class="score">${component.risk_score.toFixed(2)}</span>
        </div>
        <div class="exposure-line">Estimated exposure: <b style="color:var(--text)">₹${exposure.toLocaleString('en-IN')}</b> · Fraud type: <b style="color:var(--text)">Cross-merchant friendly fraud</b></div>
        <div class="why-text">${component.why}</div>
        ${renderCollusionGraph(component)}
        ${renderSentinelAI(component)}
      </div>
      <div class="graph-box">
        <p class="section-label" style="margin-bottom:10px;">Risk factors</p>
        <div class="factor-list">
          ${factorBar('Dispute fraction', component.dispute_fraction, '#ef5f74')}
          ${factorBar('Device sharing', component.device_sharing, '#f4845f')}
          ${factorBar('VPA rotation', component.vpa_rotation, '#5da9e9')}
          ${factorBar('Geographic correlation', geoSignalPct, '#4ade9e')}
        </div>
        <button class="btn" style="width:100%; margin-top:14px;" onclick="downloadDossier('${component.component_id}')">↓ Download Dossier PDF</button>
      </div>
    </div>
    <div class="graph-box" style="margin-top:18px;">
      <p class="section-label" style="margin-bottom:10px;">Order-level evidence</p>
      <table>
        <tr><th>Order ID</th><th>Merchant</th><th>Date</th><th>Amount</th><th>Dispute</th></tr>
        ${orderRows}
      </table>
    </div>
    <div class="timeline-box">
      <p class="section-label" style="margin-bottom:0;">Fraud lifecycle — this ring</p>
      <div class="timeline-steps">
        <div class="timeline-step done"><div class="timeline-dot"></div><div class="timeline-label">Orders Created</div><div class="timeline-date">${firstDate}</div></div>
        <div class="timeline-step done"><div class="timeline-dot"></div><div class="timeline-label">Delivered</div><div class="timeline-date">—</div></div>
        <div class="timeline-step done"><div class="timeline-dot"></div><div class="timeline-label">Disputes Filed</div><div class="timeline-date">${lastDate}</div></div>
        <div class="timeline-step done"><div class="timeline-dot"></div><div class="timeline-label">Cross-Merchant Correlation</div><div class="timeline-date">automated</div></div>
        <div class="timeline-step done"><div class="timeline-dot"></div><div class="timeline-label">Ring Detected</div><div class="timeline-date">risk ${component.risk_score.toFixed(2)}</div></div>
      </div>
    </div>
  `;
}

async function downloadDossier(componentId) {
  if (!LIVE) {
    alert('Dossier generation requires the live API (uvicorn api:app --port 8000). Currently in demo mode.');
    return;
  }
  window.open(`${API_BASE}/dossier/${componentId}`, '_blank');
}

async function fireWebhook() {
  const input = document.getElementById('orderIdInput');
  const orderId = input.value.trim();
  const log = document.getElementById('webhookLog');
  if (!orderId) return;

  if (!LIVE) {
    log.innerHTML = `<div class="log-line"><span class="tag-error">API UNREACHABLE</span> — the live API may be asleep (Render free tier can take up to 50s to wake) or the request timed out. Refresh the page to retry, or run it locally with: uvicorn api:app --port 8000</div>` + log.innerHTML;
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/webhook/dispute`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId }),
    });
    const json = await res.json();
    const tagClass = json.action === 'escalate_and_generate_dossier' ? 'tag-escalate' : 'tag-isolated';
    log.innerHTML = `<div class="log-line">
      <span class="${tagClass}">${json.action || 'error'}</span> — ${orderId}
      ${json.risk_score !== undefined ? `\nrisk_score: ${json.risk_score}` : ''}
      ${json.reason ? `\n${json.reason}` : ''}
      ${json.why ? `\n${json.why}` : ''}
    </div>` + log.innerHTML;
  } catch (e) {
    log.innerHTML = `<div class="log-line"><span class="tag-error">ERROR</span> — could not reach API: ${e.message}</div>` + log.innerHTML;
  }
}

(async function init() {
  // Show demo data IMMEDIATELY so the page is never blank, even if the
  // live server is asleep and takes up to a minute to respond.
  await loadDemoData();
  setStatus();
  renderKPIs();
  renderHotspots();
  renderMerchantIntel();
  renderCaseList();

  // Then attempt the live connection in the background. If it succeeds,
  // silently upgrade the view to live data without making the user wait.
  await tryLiveFetch();
  if (LIVE) {
    setStatus();
    renderKPIs();
    renderHotspots();
    renderMerchantIntel();
    renderCaseList();
    if (selectedId) renderCaseDetail(selectedId);
  }
})();
</script>
